<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — iOS-экран</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="ios-player">
<div class="player-bar">
  <span class="title" id="title">iOS-экран</span>
  <span class="status" id="status"></span>
  <span class="sp"></span>
  <span class="stats" id="stats" title="кадров в секунду · сколько устройство выполняло последнее действие"></span>
  <button class="btn btn--sm" onclick="send({type:'back'})" title="свайп от левого края">Назад</button>
  <button class="btn btn--sm" onclick="send({type:'home'})">Домой</button>
  <button class="btn btn--sm" onclick="send({type:'app_switcher'})">Приложения</button>
  <button class="btn btn--sm" onclick="send({type:'volume_down'})" title="громкость −">Vol −</button>
  <button class="btn btn--sm" onclick="send({type:'volume_up'})" title="громкость +">Vol +</button>
  <button class="btn btn--sm" onclick="rotate()">Повернуть</button>
  <button class="btn btn--sm" onclick="send({type:'lock'})">Заблокировать</button>
  <button class="btn btn--sm" onclick="send({type:'wake'})">Разбудить</button>
  <button class="btn btn--sm" id="restartBtn" onclick="restartAgent()">Перезапустить агент</button>
  <button class="btn btn--ghost btn--sm" onclick="location.reload()">Обновить</button>
</div>
<div class="page-error" id="err"></div>
<div class="player-stage"><img id="screen" alt="экран устройства" draggable="false"></div>
<div id="dot"></div>
<div class="player-down" id="down">
  <div><b>Трансляция экрана недоступна</b></div>
  <div class="msg" id="down-msg">WebDriverAgent не отвечает.</div>
  <button class="btn btn--primary" id="down-btn" onclick="restartAgent()">Перезапустить WebDriverAgent</button>
</div>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id") || location.pathname.split("/").pop();
if (qs.get("embed")) document.body.classList.add("embed");
const base = `/live/ios/${encodeURIComponent(id)}`;
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const img = document.getElementById("screen");
const statusEl = document.getElementById("status");
document.getElementById("title").textContent = id;

let dev = { w: 390, h: 844 };
let streaming = false;
let paused = false;
const downEl = document.getElementById("down");

// Safari will not render a multipart/x-mixed-replace <img>, so it keeps the
// polling path. Everything else gets one long-lived connection the browser
// decodes itself: no JS, no request and no image allocation per frame.
const canStream = !/^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);

// ---- streaming path -------------------------------------------------------
function startStream() {
  // a multipart stream never finishes, so attaching it before the document has
  // loaded leaves the tab spinning forever — wait for load, then connect
  const go = () => {
    if (!streaming || paused) return;
    img.src = base + "/mjpeg?t=" + Date.now();
    statusEl.textContent = "трансляция";
  };
  if (document.readyState === "complete") go();
  else window.addEventListener("load", go, { once: true });
}
function stopStream() {
  // dropping the src closes the connection, which releases the device-side
  // reader once the last viewer is gone
  img.removeAttribute("src");
}

// ---- polling path (Safari) ------------------------------------------------
let errStreak = 0;
function pump() {
  if (!streaming || paused || canStream) return;
  const next = new Image();
  next.onload = () => {
    img.src = next.src;
    statusEl.textContent = "трансляция";
    if (errStreak) { errStreak = 0; downEl.classList.remove("show"); }
    if (streaming && !paused) setTimeout(pump, 100);
  };
  next.onerror = () => {
    statusEl.textContent = "ошибка трансляции";
    if (++errStreak >= 6) { streaming = false; showDown("WebDriverAgent перестал отвечать.\nПерезапустите его, чтобы вернуть экран."); }
    else if (streaming && !paused) setTimeout(pump, 1000);
  };
  next.src = base + "/frame?t=" + Date.now();
}

// ---- pause while nobody is looking ---------------------------------------
// A tile scrolled out of the wall, or a wall in a background tab, used to keep
// pulling frames at full rate. Each paused tile is one less mjpeg reader on a
// device that is already the bottleneck.
function setPaused(v) {
  v = !!v;
  if (v === paused) return;
  paused = v;
  if (paused) {
    statusEl.textContent = "пауза";
    if (canStream) stopStream();
  } else if (streaming) {
    if (canStream) startStream(); else pump();
  }
}
window.addEventListener("message", e => {
  const d = e.data;
  if (d && d.poligon === "visible") setPaused(!d.visible);
});
document.addEventListener("visibilitychange", () => {
  // a popped-out player pauses itself; inside the wall the parent decides
  if (window.parent === window) setPaused(document.hidden);
});

// ---- watchdog -------------------------------------------------------------
// A dead WebDriverAgent leaves a perfectly valid last frame on screen, which
// looks live. Ask the server how old the newest frame actually is.
let watchdog = null;
async function checkLive() {
  if (!streaming || paused) return;
  try {
    const st = await (await fetch(base + "/state")).json();
    if (st.live) {
      downEl.classList.remove("show");
      statusEl.textContent = "трансляция";
    } else if (st.detail !== "screen not being watched") {
      statusEl.textContent = "экран замер";
      showDown("Экран не обновляется" + (st.age_ms ? " " + Math.round(st.age_ms / 1000) + "с" : "") +
        ".\nWebDriverAgent мог зависнуть — перезапустите его.");
    }
  } catch {}
}

async function init() {
  downEl.classList.remove("show");
  errStreak = 0;
  try {
    const r = await fetch(base + "/size");
    if (r.ok) { const sz = await r.json(); dev = sz; }
  } catch (e) {}
  streaming = true;
  if (canStream) {
    img.onerror = () => {
      if (!streaming || paused) return;
      statusEl.textContent = "ошибка трансляции";
      showDown("Трансляция оборвалась.\nWebDriverAgent мог перестать отвечать.");
    };
    startStream();
  } else {
    pump();
  }
  clearInterval(watchdog);
  watchdog = setInterval(checkLive, 4000);
}

function showDown(msg) {
  document.getElementById("down-msg").textContent = msg;
  downEl.classList.add("show");
}

async function restartAgent() {
  const btns = document.querySelectorAll("#restartBtn,#down-btn");
  btns.forEach(b => b.disabled = true);
  showDown("Перезапуск WebDriverAgent…");
  try {
    const r = await fetch(base + "/restart", { method: "POST", headers: { "X-Poligon-CSRF": csrf() } });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    for (let i = 0; i < 120; i++) {
      await new Promise(res => setTimeout(res, 2000));
      const jr = await fetch(base + "/job");
      if (jr.status === 403) throw new Error("бронь потеряна — вернитесь на ферму и забронируйте устройство заново");
      const j = await jr.json();
      if (j.step) document.getElementById("down-msg").textContent = "Перезапуск… " + j.step;
      if (j.state === "done") break;
      if (j.state === "failed") throw new Error(j.err || "перезапуск не удался");
    }
    errStreak = 0;
    init();
  } catch (e) {
    showDown("Перезапуск не удался:\n" + e.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

// map a browser event to device points, accounting for object-fit:contain
// letterboxing inside the (full-size) <img> box
function toDevice(ev) {
  const r = img.getBoundingClientRect();
  const ir = dev.w / dev.h;           // device aspect (== frame aspect)
  const br = r.width / r.height;       // img box aspect
  let w = r.width, h = r.height, ox = 0, oy = 0;
  if (br > ir) { w = h * ir; ox = (r.width - w) / 2; }   // pillarbox (bars L/R)
  else         { h = w / ir; oy = (r.height - h) / 2; }  // letterbox (bars T/B)
  const x = (ev.clientX - r.left - ox) / w * dev.w;
  const y = (ev.clientY - r.top - oy) / h * dev.h;
  return { x: Math.max(0, Math.min(dev.w, x)), y: Math.max(0, Math.min(dev.h, y)) };
}

// ---- control channel -----------------------------------------------------
// One WebSocket for every action: no request, cookie and CSRF round per tap.
// If it cannot connect (an old proxy in the way), actions fall back to POST.
let ws = null, wsReady = false, seq = 0;
const sentAt = new Map();
const statsEl = document.getElementById("stats");
let lastFps = null, lastMs = null;
function showStats() {
  const parts = [];
  if (lastFps != null) parts.push(lastFps + " fps");
  if (lastMs != null) parts.push(lastMs + " мс");
  statsEl.textContent = parts.join(" · ");
}
function connectControl() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const sock = new WebSocket(`${proto}//${location.host}${base}/control`);
  sock.onopen = () => { ws = sock; wsReady = true; };
  sock.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "stats") {
      lastFps = m.fps ?? null;
      showStats();
    } else if (m.type === "ack") {
      const t0 = sentAt.get(m.seq); sentAt.delete(m.seq);
      if (t0) lastMs = Math.round(performance.now() - t0);
      showStats();
      document.getElementById("err").textContent = m.error || "";
      afterAck(m);
    }
  };
  sock.onclose = e => {
    const was = wsReady;
    ws = null; wsReady = false;
    if (e.code === 4003) { document.getElementById("err").textContent = "бронь снята — управление отключено"; return; }
    setTimeout(connectControl, was ? 500 : 3000);
  };
}
const ackWaiters = new Map();
function afterAck(m) { const f = ackWaiters.get(m.seq); if (f) { ackWaiters.delete(m.seq); f(m); } }

function send(action) {
  const n = ++seq;
  sentAt.set(n, performance.now());
  if (wsReady) {
    ws.send(JSON.stringify({ ...action, seq: n }));
    return new Promise(res => ackWaiters.set(n, res));
  }
  return sendPost(action, n);
}
async function sendPost(action, n) {
  try {
    const r = await fetch(base + "/input", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Poligon-CSRF": csrf() },
      body: JSON.stringify(action),
    });
    const t0 = sentAt.get(n); sentAt.delete(n);
    if (t0) { lastMs = Math.round(performance.now() - t0); showStats(); }
    if (!r.ok) document.getElementById("err").textContent = (await r.json()).error || r.statusText;
    else document.getElementById("err").textContent = "";
  } catch (e) { document.getElementById("err").textContent = e.message; }
}

async function rotate() {
  await send({ type: "rotate" });
  // the frame and the point space both turn: re-read the size
  try { const r = await fetch(base + "/size"); if (r.ok) dev = await r.json(); } catch {}
}

// ---- pointer --------------------------------------------------------------
// A still press is a tap, or a long press when held; a drag replays its whole
// trail (sampled every ~30ms) so a curve or a slow scroll behaves as drawn.
// Alt+drag is a pinch around the press point: right/up zooms in.
const dot = document.getElementById("dot");
let down = null;
const HOLD_MS = 450;

img.addEventListener("dragstart", e => e.preventDefault());
img.addEventListener("contextmenu", e => e.preventDefault());
img.addEventListener("pointerdown", e => {
  e.preventDefault();
  const p = toDevice(e);
  down = { ...p, t: performance.now(), cx: e.clientX, cy: e.clientY, moved: false,
           pinch: e.altKey, trail: [[p.x, p.y, 0]], lastT: performance.now() };
  dot.style.left = e.clientX + "px"; dot.style.top = e.clientY + "px"; dot.style.opacity = 1;
  img.setPointerCapture(e.pointerId);
});
img.addEventListener("pointermove", e => {
  if (!down) return;
  e.preventDefault();
  dot.style.left = e.clientX + "px"; dot.style.top = e.clientY + "px";
  if (Math.hypot(e.clientX - down.cx, e.clientY - down.cy) > 6) down.moved = true;
  const now = performance.now();
  if (now - down.lastT >= 30) {
    const p = toDevice(e);
    down.trail.push([p.x, p.y, Math.round(now - down.lastT)]);
    down.lastT = now;
  }
});
img.addEventListener("pointerup", e => {
  if (!down) return;
  e.preventDefault();
  dot.style.opacity = 0;
  const d = down; down = null;
  const up = toDevice(e);
  const held = performance.now() - d.t;
  if (d.pinch) {
    const dist = (e.clientX - d.cx) - (e.clientY - d.cy);
    if (Math.abs(dist) > 6) send({ type: "pinch", x: d.x, y: d.y, scale: Math.max(0.2, Math.min(5, Math.exp(dist / 150))) });
    return;
  }
  if (!d.moved) {
    if (held >= HOLD_MS) send({ type: "hold", x: up.x, y: up.y, duration: Math.min(held / 1000, 5) });
    else send({ type: "tap", x: up.x, y: up.y });
    return;
  }
  d.trail.push([up.x, up.y, Math.max(16, Math.round(performance.now() - d.lastT))]);
  // WDA replays the trail at its recorded pace; a fling needs to stay quick
  send({ type: "path", points: d.trail });
});
img.addEventListener("pointercancel", () => { down = null; dot.style.opacity = 0; });

let wheelAcc = 0, wheelTimer = null, wheelPt = null, pinchAcc = 0;
img.addEventListener("wheel", e => {
  e.preventDefault();
  wheelPt = toDevice(e);
  // a trackpad pinch arrives as ctrl+wheel
  if (e.ctrlKey) pinchAcc += e.deltaY; else wheelAcc += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    if (pinchAcc) {
      send({ type: "pinch", x: wheelPt.x, y: wheelPt.y, scale: Math.max(0.3, Math.min(3, Math.exp(-pinchAcc / 100))) });
      pinchAcc = 0;
    }
    if (wheelAcc) {
      const amount = Math.max(-260, Math.min(260, wheelAcc));
      const cx = wheelPt.x, cy = dev.h / 2;
      send({ type: "swipe", x: cx, y: cy + amount / 2, x2: cx, y2: cy - amount / 2, duration: 0.1 });
      wheelAcc = 0;
    }
  }, 60);
}, { passive: false });

// ---- keyboard -------------------------------------------------------------
// Typed characters are batched for a moment so a fast typist costs one WDA
// call per burst, not per key. Paste (⌘V / Ctrl+V) types the clipboard text —
// Cyrillic included, WDA types any Unicode.
let typeBuf = "", typeTimer = null;
function typeText(t) {
  typeBuf += t;
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => { const b = typeBuf; typeBuf = ""; if (b) send({ type: "text", text: b }); }, 40);
}
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length === 1) typeText(e.key);
  else if (e.key === "Backspace") typeText("\b");
  else if (e.key === "Enter") typeText("\n");
  else return;
  e.preventDefault();
});
addEventListener("paste", e => {
  const t = e.clipboardData && e.clipboardData.getData("text");
  if (t) { e.preventDefault(); typeText(t); }
});

connectControl();
init();
</script>
</body>
</html>
